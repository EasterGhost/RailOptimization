modLoader="javafml"
loaderVersion="[0,)"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_homepage}"
logoFile="${mod_icon}"
authors="${mod_authors}"
credits="${mod_credits}"
description='''${mod_description}'''
displayTest="IGNORE_SERVER_VERSION"

[modproperties."${mod_id}"]
sources="${mod_sources}"
authorEmails="${mod_author_emails}"

[[dependencies."${mod_id}"]]
modId="forge"
mandatory=true
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
