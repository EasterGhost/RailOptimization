name: Java CI with Gradle

on:
  push:
    branches: [ "1.20-.4" ]
  pull_request:
    branches: [ "1.20-.4" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: [ "1.20.1", "1.20.2", "1.20.4", "1.20.5", "1.20.6" ]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java toolchains
      uses: actions/setup-java@v4
      with:
        java-version: |
          17
          21
          25
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    - name: Build available loader artifacts
      run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }}
    - name: Run Fabric GameTests
      run: ./gradlew :fabric:runGameTest -Pminecraft_version=${{ matrix.minecraft }}
    - name: Run NeoForge GameTests
      if: matrix.minecraft != '1.20.1'
      run: ./gradlew :neoforge:runGameTestServer -Pminecraft_version=${{ matrix.minecraft }}
